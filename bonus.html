<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bonus Stage — 3D Art &amp; Animation · AGSAPAULA</title>
<meta name="description" content="3D models and animations by Angelo Sapaula.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/level.css">
</head>
<body class="lv bonus-page">

<header class="topbar">
  <div class="topbar-in">
    <div class="lv-brand">
      <a href="index.html" aria-label="Angelo Sapaula, home"><img src="logo.svg" alt="" width="46" height="28"></a>
      <a class="btn btn-ghost" href="index.html?level=9">← <span class="hide-sm">Back to </span>Portfolio</a>
    </div>
    <div class="topbar-mid"><span class="px" id="tbLevel" style="color:var(--gold)">★ BONUS STAGE</span></div>
    <div class="topbar-right">
      <a class="btn btn-ghost" href="level.html">Projects ▶</a>
      <button type="button" class="btn btn-ghost sq hide-sm" id="soundBtn" aria-label="Turn chiptune sound on"><span data-sound-text>SOUND OFF</span></button>
    </div>
  </div>
</header>

<main>
  <section class="bonus-hero" aria-label="Bonus stage intro">
    <div id="stars" aria-hidden="true"></div>
    <div class="bonus-hero-in">
      <span class="eyebrow px bonus-found">SECRET AREA FOUND!</span>
      <h1>BONUS STAGE</h1>
      <p class="lead">3D models and animations I made in Maya and Blender, each shown as a collectible.</p>
      <div class="tabs" role="tablist" aria-label="Collection" id="tabs"></div>
      <div class="bonus-progress">
        <span class="px">INSPECTED <span id="got">0</span> / <span id="total">0</span></span>
        <div class="bonus-bar"><div id="gotBar"></div></div>
      </div>
    </div>
  </section>

  <section class="section" aria-label="Inspect selected piece">
    <div class="container inspect">
      <div class="viewer">
        <div class="viewer-main" id="viewer"></div>
        <div class="viewer-thumbs" id="thumbs"></div>
      </div>
      <div class="details panel">
        <span class="rarity" id="dRarity" style="align-self:flex-start"></span>
        <h2 id="dTitle"></h2>
        <div class="tags" id="dTags"></div>
        <p id="dDesc"></p>
        <ul id="dFeat"></ul>
      </div>
    </div>
  </section>

  <section class="section" aria-label="Collection">
    <div class="container">
      <div class="lv-head"><div><p class="eyebrow px" style="color:var(--gold)">◆ COLLECTION</p><h2>All pieces</h2></div></div>
      <div class="collection" id="collection"></div>
    </div>
  </section>
</main>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/bonus.js"></script>
</body>
</html>
